<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CivicFix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🛠️</div>
                <span>CivicFix</span>
            </a>
            <div class="nav-auth-section" id="nav-user-widget"></div>
        </div>
    </header>

    <main class="main-wrapper" style="max-width: 540px; margin-top: 2rem;">
        <div class="card p-6">
            <div class="text-center mb-4">
                <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.5rem;">🛠️</div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">Sign In to CivicFix</h1>
                <p class="text-muted text-sm mt-1">Access your civic complaint dashboard or administrative desk</p>
            </div>

            <!-- 1-Click Fast Evaluation Demo Login Buttons -->
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem;">
                <label class="form-label" style="margin-bottom: 0.6rem; color: #0369a1;">⚡ 1-Click Fast Evaluation Login (Choose Role):</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <button type="button" class="btn btn-outline btn-sm text-left" onclick="quickLogin('citizen@civicfix.org')">
                        👤 <strong>Citizen</strong> (John)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm text-left" onclick="quickLogin('moderator@civicfix.org')">
                        🛡️ <strong>Moderator</strong> (Sarah)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm text-left" onclick="quickLogin('rep.pwd@civicfix.org')">
                        🏢 <strong>Dept Rep</strong> (PWD)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm text-left" onclick="quickLogin('admin@civicfix.org')">
                        ⚙️ <strong>Administrator</strong>
                    </button>
                </div>
            </div>

            <!-- Standard Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required value="citizen@civicfix.org">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="password123">
                    <small class="form-hint">Any password accepted in local evaluation mode.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
                    Sign In to Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--slate-200);">
                <p class="text-sm text-muted">
                    Don't have an account yet? <a href="register.html" class="font-bold">Register as a Citizen</a>
                </p>
                <p class="text-xs text-muted mt-2">
                    <a href="index.html">← Return to CivicFix Home</a>
                </p>
                <div class="mt-3">
                    <button type="button" class="btn btn-ghost btn-sm" onclick="window.civicfixAuth.showSupabaseModal()" style="font-size:0.8rem; color:#0284c7; border:1px solid #bae6fd; background:#f0f9ff; padding:0.35rem 0.75rem; border-radius:6px;">
                        ⚡ Configure Supabase API Keys
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function quickLogin(email) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const res = await window.civicfixAuth.login(email);
            if (res.success) {
                alert(`Welcome back, ${res.user.full_name}! Active role: ${res.user.role.toUpperCase()}`);
                window.location.href = 'complaints.html';
            } else {
                alert(res.error);
            }
        });
    </script>
</body>
</html>
