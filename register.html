<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration – CivicFix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🛠️</div>
                <span>CivicFix</span>
            </a>
            <div class="nav-auth-section" id="nav-user-widget"></div>
        </div>
    </header>

    <main class="main-wrapper" style="max-width: 540px; margin-top: 2rem;">
        <div class="card p-6">
            <div class="text-center mb-4">
                <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.5rem;">👤</div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">Citizen Registration</h1>
                <p class="text-muted text-sm mt-1">Join CivicFix to report local problems and monitor city repair progress</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Jane Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Contact Phone</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="+1-555-0188" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-role">Account Type</label>
                    <select id="reg-role" class="form-control">
                        <option value="citizen" selected>👤 Citizen (Report & Track Issues)</option>
                        <option value="moderator">🛡️ Issue Moderator (Verification Desk)</option>
                        <option value="department_rep">🏢 Department / Maintenance Representative</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Create a secure password" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-reg-submit">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--slate-200);">
                <p class="text-sm text-muted">
                    Already have an account? <a href="login.html" class="font-bold">Sign In here</a>
                </p>
                <p class="text-xs text-muted mt-2">
                    <a href="index.html">← Return to CivicFix Home</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const role = document.getElementById('reg-role').value;

            const res = await window.civicfixAuth.register(name, email, phone, role);
            if (res.success) {
                alert(`Account created successfully! Welcome, ${res.user.full_name}.`);
                window.location.href = 'submit-complaint.html';
            } else {
                alert(res.error);
            }
        });
    </script>
</body>
</html>
